# nginx interno del contenedor del frontend (detrás del reverse proxy del VPS).
# SPA + PWA: index.html y el service worker NUNCA se cachean (el SW gestiona la
# actualización de la app); los assets con hash de Vite se cachean como inmutables.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
